name: Windows release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep every main update: a newer push must not cancel a release in progress.
jobs:
  package:
    name: Verify and package Windows portable
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare pinned SDK and OBS
        shell: pwsh
        run: ./scripts/Setup-Dev.ps1 -Dependencies dotnet,obs
      - name: Install locked browser dependencies
        run: npm ci
        working-directory: web
      - name: Verify code and compile matching native plugin
        shell: pwsh
        run: ./scripts/Verify.ps1 -Mode CodeOnly
      - name: Build modified OBS capture component
        shell: pwsh
        run: ./scripts/Build-InstrumentedObs.ps1
      - name: Package and validate portable app
        shell: pwsh
        run: |
          . ./scripts/ReleaseTools.ps1
          $version = Get-ReleaseVersion -RunId $env:GITHUB_RUN_ID -Commit $env:GITHUB_SHA
          ./scripts/Package-Portable.ps1 -Version $version
          Get-ReleaseAssets -Directory .artifacts/releases -Version $version
      - name: Store the three verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-win-x64
          path: |
            .artifacts/releases/*.zip
            .artifacts/releases/*.sha256
            .artifacts/releases/*.manifest.json
          if-no-files-found: error
          # The parent .artifacts directory is hidden; only the three patterns above are included.
          include-hidden-files: true
          # Rerun-all replaces this run's temporary artifact, never a published release.
          overwrite: true
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish Windows prerelease
    needs: package
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portable-win-x64
          path: .artifacts/releases
      - name: Validate assets and publish complete prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Publish-Release.ps1
