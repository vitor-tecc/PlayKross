name: Bug or streaming failure
description: Report a reproducible failure with evidence.
body:
  - type: textarea
    id: reproduce
    attributes:
      label: What happened and how to reproduce it
      description: Include expected behavior and whether capture, encoding, networking or playback failed.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows/GPU/driver, browser/OS, source app, requested settings, viewer count and local vs external network.
  - type: textarea
    id: measurements
    attributes:
      label: Measurements and redacted diagnostics
      description: Actual capture/encoded/decoded/presented FPS, bitrate, encoder, loss, RTT and ICE path if known. Do not include invitations, credentials, IP addresses or private screenshots.
